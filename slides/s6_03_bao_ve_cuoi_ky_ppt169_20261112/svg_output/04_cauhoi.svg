span><tspan x="102" y="470" fill="#4A5560" font-size="19">phân loại cố định.</tspan></text></g></g><g id="04-RQ2" data-pptx-bounds="462 208 352 296"><rect id="04-RQ2-card" x="462" y="208" width="352" height="296" fill="#FFFFFF" rx="8"/><g id="04-RQ2-tag" data-pptx-bounds="482 226 51 28"><text id="04-RQ2-tag-text" x="482" y="246" font-size="22" fill="#0F766E" font-weight="700"><tspan x="482" y="246" fill="#0F766E" font-size="22">RQ2</tspan></text></g><g id="04-RQ2-q" data-pptx-bounds="482 261 314 55"><text id="04-RQ2-q-text" x="482" y="280" font-size="21" fill="#161D26"><tspan x="482" y="280" fill="#161D26" font-size="21">Bộ phân loại nào phù hợp với</tspan><tspan x="482" y="308" fill="#161D26" font-size="21">152 chiều đặc trưng?</tspan></text></g><g id="04-RQ2-d" data-pptx-bounds="482 375 314 102"><text id="04-RQ2-d-text" x="482" y="392" font-size="19" fill="#4A5560"><tspan x="482" y="392" fill="#4A5560" font-size="19">Sáu bộ trên cùng vectơ; siêu tham</tspan><tspan x="482" y="418" fill="#4A5560" font-size="19">số chọn bằng 5-fold CV trên train.</tspan><tspan x="482" y="444" fill="#4A5560" font-size="19">DT, RF, GB chạy ba seed, bộ tất</tspan><tspan x="482" y="470" fill="#4A5560" font-size="19">định một lần.</tspan></text></g></g><g id="04-RQ3" data-pptx-bounds="842 208 352 296"><rect id="04-RQ3-card" x="842" y="208" width="352" height="296" fill="#FFFFFF" rx="8"/><g id="04-RQ3-tag" data-pptx-bounds="862 226 51 28"><text id="04-RQ3-tag-text" x="862" y="246" font-size="22" fill="#0F766E" font-weight="700"><tspan x="862" y="246" fill="#0F766E" font-size="22">RQ3</tspan></text></g><g id="04-RQ3-q" data-pptx-bounds="862 261 314 55"><text id="04-RQ3-q-text" x="862" y="280" font-size="21" fill="#161D26"><tspan x="862" y="280" fill="#161D26" font-size="21">Che và cắt vùng phổi có làm</tspan><tspan x="862" y="308" fill="#161D26" font-size="21">đổi macro-F1 không?</tspan></text></g><g id="04-RQ3-d" data-pptx-bounds="862 375 314 76"><text id="04-RQ3-d-text" x="862" y="392" font-size="19" fill="#4A5560"><tspan x="862" y="392" fill="#4A5560" font-size="19">Năm kịch bản: huần luyện và đánh</tspan><tspan x="862" y="418" fill="#4A5560" font-size="19">giá cùng một chế độ ảnh, đo lại</tspan><tspan x="862" y="444" fill="#4A5560" font-size="19">trên cùng tập validation.</tspan></text></g></g><g id="04-h7-band" data-pptx-bounds="82 522 1116 88"><rect id="04-h7-band-card" x="82" y="522" width="1116" height="88" fill="#F3E7D6" rx="8" stroke="#B45309" stroke-width="1"/><g id="04-h7-tag" data-pptx-bounds="102 535 139 24"><text id="04-h7-tag-text" x="102" y="552" font-size="19" fill="#B45309" font-weight="700"><tspan x="102" y="552" fill="#B45309" font-size="19">RANH GIỊI H7</tspan></text></g><g id="04-h7-text" data-pptx-bounds="102 561 1078 50"><text id="04-h7-text-text" x="102" y="578" font-size="19" fill="#161D26"><tspan x="102" y="578" fill="#161D26" font-size="19">Chỉ dùng học máy cổ điểu với đặc trưng thủ công — không Deep Learning (mạng nơ-ron); ảnh gốc xám 299×299,</tspan><tspan x="102" y="604" fill="#161D26" font-size="19">không dữ liệu ngoài bộ đã công bố.</tspan></text></g></g><g id="footer-slot" data-pptx-placeholder="footer" data-pptx-idx="1" data-pptx-bounds="82 634 900 24"><text id="04-footer-carrier-carrier" x="82" y="648" font-size="15" fill="#7A8493" data-pptx-carrier="true"><tspan x="82" y="648" fill="#7A8493" font-size="15">Nguồn: results/threshold_v3.md mục 1 · report/01 mục 1.4</tspan></text></g><g id="slide-number-slot" data-pptx-placeholder="slide-number" data-pptx-idx="2" data-pptx-bounds="998 634 200 24"><text id="04-page-number-carrier-carrier" x="1198" y="648" font-size="15" fill="#7A8493" text-anchor="end" data-pptx-carrier="true"><tspan x="1198" y="648" fill="#7A8493" font-size="15">4 / 28</tspan></text></g>

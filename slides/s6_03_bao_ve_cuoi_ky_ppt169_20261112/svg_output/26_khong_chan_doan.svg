d" x="82" y="444" width="1116" height="82" fill="#E4EFEC" rx="6"/><g id="26-d4-note-text" data-pptx-bounds="104 460 1074 57"><text id="26-d4-note-text-text" x="104" y="482" font-size="24" fill="#161D26"><tspan x="104" y="482" fill="#161D26" font-size="24">Quy tắc D4: Mọi lời giải thích về sự khác biệt giữa val và test đều là giả thuyết chưa kiểm</tspan><tspan x="104" y="508" fill="#161D26" font-size="24">chứng, không nêu nguyên nhân.</tspan></text></g></g><g id="26-scope" data-pptx-bounds="82 538 1116 82"><rect id="26-scope-card" x="82" y="538" width="1116" height="82" fill="#FFFFFF" rx="8"/><g id="26-scope-text" data-pptx-bounds="106 545 1070 66"><text id="26-scope-text-text" x="106" y="570" font-size="28" fill="#161D26"><tspan x="106" y="570" fill="#161D26" font-size="28">Các con số trong đề tài này chỉ được đánh giá trên chính bộ dữ liệu và bước tiền</tspan><tspan x="106" y="600" fill="#161D26" font-size="28">xử lý đã dùng; đổi nguồn ảnh, thiết bị hoặc tiền xử lý thì chưa được đo lại.</tspan></text></g></g><g id="footer-slot" data-pptx-placeholder="footer" data-pptx-idx="1" data-pptx-bounds="82 634 900 24"><text id="26-footer-carrier-carrier" x="82" y="648" font-size="15" fill="#7A8493" data-pptx-carrier="true"><tspan x="82" y="648" fill="#7A8493" font-size="15">Nguồn: demo/streamlit_app.py (DISCLAIMER) · results/final_test/r5_gioi_han.md (D4)</tspan></text></g><g id="slide-number-slot" data-pptx-placeholder="slide-number" data-pptx-idx="2" data-pptx-bounds="998 634 200 24"><text id="26-page-number-carrier-carrier" x="1198" y="648" font-size="15" fill="#7A8493" text-anchor="end" data-pptx-carrier="true"><tspan x="1198" y="648" fill="#7A8493" font-size="15">26 / 28</tspan></text></g>
